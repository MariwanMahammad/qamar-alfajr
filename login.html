<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030407">
    <title>چوونەژوورەوە - Roya</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { min-height: 100vh; background: radial-gradient(ellipse at center, #0a0e1a 0%, #030407 70%); display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, 'Noto Kufi Arabic', sans-serif; color: #fff; padding: 20px; position: relative; overflow: hidden; }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

        .login-card { background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 420px; padding: clamp(25px, 5vw, 40px) clamp(20px, 4vw, 30px); border-radius: 20px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.15); border: 1px solid rgba(0, 243, 255, 0.2); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 1; animation: fadeIn 0.6s ease-out; transition: opacity 0.5s, transform 0.5s; }
        .login-card.hide { opacity: 0; transform: scale(0.85); pointer-events: none; position: absolute; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== لۆگۆ: مانگ + ناوی Roya (وەک splash) ===== */
        .moon { background: black; width: clamp(80px, 24vw, 100px); height: clamp(80px, 24vw, 100px); border-radius: 50%; position: relative; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        .moon::before { content: ''; background-color: #FFF; position: absolute; display: block; height: 100%; width: 100%; border-radius: 50%; z-index: -1; animation: animation 3.2s linear infinite alternate; }
        @keyframes animation { 0% { transform: translateX(var(--shift, 12px)) scale(0.9); box-shadow: none; } 50% { transform: translateX(0) scale(1.02); box-shadow: 0 0 8px #FFF, 0 0 25px 1px #00f3ff; } 100% { transform: translateX(calc(var(--shift, 12px) * -1)) scale(0.9); box-shadow: none; } }
        .moon-name { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; direction: ltr; font-family: 'Segoe UI', Tahoma, sans-serif; font-weight: 700; font-size: clamp(18px, 5.4vw, 24px); letter-spacing: 0.12em; padding-left: 0.12em; color: #fff; text-shadow: 0 0 10px #00f3ff, 0 0 24px #00f3ff; pointer-events: none; }

        .title { font-size: clamp(18px, 4.5vw, 22px); font-weight: bold; color: #fff; text-shadow: 0 0 10px #00f3ff; margin: 0; line-height: 1.4; }
        .subtitle { font-size: clamp(11px, 2.8vw, 13px); color: #00f3ff; margin-top: 6px; margin-bottom: 5px; }
        .datetime-box { font-size: clamp(10px, 2.5vw, 12px); color: #64748b; margin-bottom: 30px; letter-spacing: 0.5px; direction: ltr; }

        .input-group { width: 100%; text-align: right; margin-bottom: 20px; }
        .input-group label { display: block; font-size: clamp(12px, 3vw, 13px); color: #94a3b8; margin-bottom: 8px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-group input { width: 100%; padding: 13px 16px; background: #030407; border: 1px solid #1e293b; border-radius: 10px; color: #fff; font-size: 14px; font-family: inherit; outline: none; transition: 0.3s; }
        .input-group input::placeholder { color: #475569; }
        .input-group input:focus { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .input-group input.has-icon { padding-left: 45px; }
        .input-group input.code-input { text-align: center; letter-spacing: 8px; font-size: 20px; direction: ltr; }

        .toggle-password { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; color: #94a3b8; transition: 0.3s; line-height: 1; }
        .toggle-password:hover { color: #00f3ff; }

        /* مەرجەکانی وشەی نهێنی */
        .rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .rule { font-size: 11px; padding: 3px 10px; border-radius: 12px; border: 1px solid #1e293b; color: #64748b; transition: 0.3s; }
        .rule.ok { border-color: #22c55e; color: #86efac; background: rgba(34, 197, 94, 0.12); }

        .login-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #00f3ff, #0077ff); color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); }
        .login-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        .link-btn { background: none; border: none; color: #00f3ff; font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 16px; padding: 4px; opacity: 0.85; }
        .link-btn:hover { opacity: 1; text-decoration: underline; }
        .reset-title { font-size: 16px; color: #00f3ff; margin-bottom: 6px; }
        .reset-hint { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.8; }

        .spinner { width: 16px; height: 16px; border: 2px solid rgba(0, 0, 0, 0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        .login-btn.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message { width: 100%; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; animation: slideDown 0.3s ease-out; line-height: 1.7; }
        .message.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
        .message.success { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.5); color: #86efac; }
        .message.warning { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.5); color: #fcd34d; }
        .message.show { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* پەڕەی بەخێرهاتن */
        .welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; padding: 20px; animation: welcomeFadeIn 0.6s ease-out; }
        .welcome-screen.show { display: flex; }
        @keyframes welcomeFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glow { position: absolute; width: 600px; height: 600px; max-width: 90vw; max-height: 90vw; border-radius: 50%; background: radial-gradient(circle, rgba(0, 243, 255, 0.18), transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; animation: glowPulse 3s infinite ease-in-out; }
        @keyframes glowPulse { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
        .welcome-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .welcome-moon { animation: moonFloat 2.5s ease-in-out infinite; margin-bottom: 10px; }
        .welcome-moon .moon { width: clamp(90px, 22vw, 120px); height: clamp(90px, 22vw, 120px); margin-bottom: 0; --shift: 18px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); }
        .welcome-moon .moon-name { font-size: clamp(22px, 6vw, 30px); }
        @keyframes moonFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .welcome-company { font-size: clamp(13px, 3.2vw, 17px); color: #00f3ff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); opacity: 0; animation: fadeUp 0.6s ease-out 0.2s forwards; }
        .welcome-text { font-size: clamp(24px, 5.5vw, 40px); font-weight: bold; color: #fff; text-shadow: 0 0 10px #00f3ff, 0 0 25px #00f3ff, 0 0 45px rgba(0, 243, 255, 0.6); line-height: 1.5; letter-spacing: 1px; opacity: 0; animation: welcomeIn 1s ease-out 0.5s forwards; padding: 0 10px; }
        @keyframes welcomeIn { 0% { opacity: 0; transform: scale(0.5) translateY(20px); letter-spacing: 15px; } 60% { opacity: 1; transform: scale(1.05) translateY(0); letter-spacing: 3px; } 100% { opacity: 1; transform: scale(1) translateY(0); letter-spacing: 1px; } }
        .welcome-name { font-size: clamp(16px, 4vw, 22px); color: #fbbf24; font-weight: bold; text-shadow: 0 0 15px rgba(251, 191, 36, 0.6); opacity: 0; animation: fadeUp 0.6s ease-out 1.1s forwards; margin-top: 5px; }
        .welcome-role { font-size: clamp(12px, 3vw, 15px); color: #00f3ff; background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.35); padding: 8px 22px; border-radius: 25px; font-weight: bold; letter-spacing: 0.5px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.25); opacity: 0; animation: fadeUp 0.6s ease-out 1.4s forwards; }
        .welcome-loader { margin-top: 25px; display: flex; gap: 8px; opacity: 0; animation: fadeUp 0.6s ease-out 1.7s forwards; }
        .welcome-loader span { width: 10px; height: 10px; border-radius: 50%; background: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.8); animation: bounce 1.2s infinite ease-in-out; }
        .welcome-loader span:nth-child(2) { animation-delay: 0.2s; }
        .welcome-loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-10px); opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 360px) { .login-card { padding: 20px 15px; } .welcome-content { gap: 12px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <!-- کارتی چوونەژوورەوە -->
    <div class="login-card" id="loginCard">
        <div class="moon"><span class="moon-name">Roya</span></div>

        <h1 class="title">کۆمپانیای قمر الفجر</h1>
        <div class="subtitle">سیستەمی Roya بۆ مۆڵەتی کارمەندان</div>

        <div class="datetime-box" id="datetime"></div>

        <div class="message" id="message"></div>

        <!-- ١. چوونەژوورەوە -->
        <div id="loginView" style="width: 100%;">
            <form id="login-form">
                <div class="input-group">
                    <label>ناوی بەکارهێنەر:</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-name" placeholder="ناوی خۆت بنووسە" autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>وشەی نهێنی:</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" class="has-icon" placeholder="وشەی نهێنی بنووسە" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)" aria-label="پیشاندانی وشەی نهێنی"></button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">چوونە ژوورەوە</span>
                </button>
            </form>
            <button type="button" class="link-btn" onclick="showReset()">وشەی نهێنیت لەبیر چووە؟</button>
        </div>

        <!-- ٢. گەڕاندنەوەی وشەی نهێنی -->
        <div id="resetView" style="width: 100%;" hidden>
            <div id="step1" class="step">
                <div class="input-group">
                    <label>ئیمەیل یان ژمارەی مۆبایل:</label>
                    <div class="input-wrapper">
                        <input type="text" id="reset-contact" dir="auto" placeholder="name@mail.com / 0750 000 0000" autocomplete="off">
                    </div>
                </div>
                <button type="button" class="login-btn" onclick="sendResetCode()">📨 ناردنی کۆد</button>
            </div>

            <div id="step2" class="step" hidden>
                <p class="reset-hint">کۆدی ٦ ژمارەیی نێردراو بنووسە. کۆدەکە ٥ خولەک کار دەکات.</p>
                <div class="input-group">
                    <label>کۆدی پشتڕاستکردنەوە:</label>
                    <div class="input-wrapper">
                        <input type="text" id="reset-code" class="code-input" maxlength="6" inputmode="numeric" placeholder="------" autocomplete="one-time-code">
                    </div>
                </div>
                <button type="button" class="login-btn" onclick="verifyCode()">✅ پشتڕاستکردنەوە</button>
                <button type="button" class="link-btn" onclick="sendResetCode()">کۆدەکە نەگەیشت؟ دووبارە بنێرە</button>
            </div>

            <div id="step3" class="step" hidden>
                <p class="reset-hint">وشەی نهێنی نوێ دابنێ.</p>
                <div class="input-group">
                    <label>وشەی نهێنی نوێ:</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password" class="has-icon" placeholder="وشەی نهێنی نوێ" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)" aria-label="پیشاندانی وشەی نهێنی"></button>
                    </div>
                    <div class="rules" id="newRules"></div>
                </div>
                <div class="input-group">
                    <label>دووبارەکردنەوەی وشەی نهێنی:</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" class="has-icon" placeholder="دووبارە بینووسەوە" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)" aria-label="پیشاندانی وشەی نهێنی"></button>
                    </div>
                </div>
                <button type="button" class="login-btn" onclick="saveNewPassword()">💾 پاشەکەوتکردن</button>
            </div>

            <button type="button" class="link-btn" onclick="showLogin()">← گەڕانەوە بۆ چوونە ژوورەوە</button>
        </div>
    </div>

    <!-- پەڕەی بەخێرهاتن -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="glow"></div>
        <div class="welcome-content">
            <div class="welcome-moon"><div class="moon"><span class="moon-name">Roya</span></div></div>
            <div class="welcome-company">کۆمپانیای قمر الفجر</div>
            <div class="welcome-text">بەخێرهاتی بۆ سیستەمی Roya</div>
            <div class="welcome-name" id="welcomeName"></div>
            <div class="welcome-role" id="welcomeRole"></div>
            <div class="welcome-loader"><span></span><span></span><span></span></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
